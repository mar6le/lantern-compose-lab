name: Lantern Compose verification
run-name: Lantern / ${{ github.ref_name }}

on:
  push:
    tags: ['lab-*']

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  compose-tests:
    name: Check the Compose release on Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      BASE_URL: http://127.0.0.1:8592
      EXPECTED_RELEASE: devops6-lantern-73
      CHECK_TIMEOUT: '2.5'
      LANTERN_IMAGE: lantern-web:${{ github.sha }}
      LANTERN_CONTAINER: lantern-web
      LANTERN_PORT: '8592'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install the pinned Python packages
        id: deps
        run: |
          mkdir -p reports
          python -m pip install -r requirements.txt 2>&1 | tee reports/pip.log
      - name: Build the Compose image
        run: docker compose --progress plain build 2>&1 | tee reports/build.log
      - name: Start and wait on the published port
        id: service
        run: |
          docker compose up -d --no-build --wait --wait-timeout 15 \
            2>&1 | tee reports/start.log
          timeout 12s curl -fsS --max-time 2 --retry 8 --retry-delay 1 \
            --retry-all-errors -o /dev/null -w 'HTTP %{http_code}\n' \
            "$BASE_URL/" 2>&1 | tee reports/ready.log
      - name: Inspect Nginx and packaged files
        id: inside
        run: |
          python -m pytest -v --hosts="docker://$LANTERN_CONTAINER" tests/inside \
            --junitxml=reports/inside.xml 2>&1 | tee reports/inside.log
      - name: Compare responses with the HTTP contract
        id: outside
        if: ${{ !cancelled() && steps.service.outcome == 'success' }}
        run: |
          python -m pytest -v tests/outside --junitxml=reports/outside.xml \
            2>&1 | tee reports/outside.log
      - name: Test the verification command in isolation
        id: unit
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          python -m pytest -v tests/unit --junitxml=reports/unit.xml \
            2>&1 | tee reports/unit.log
      - name: Verify the homepage with real curl
        id: cli
        if: ${{ !cancelled() && steps.service.outcome == 'success' }}
        run: python verify_lantern.py 2>&1 | tee reports/verify.log
      - name: Готовність підтверджено
        if: success()
        run: echo "All checks passed for $EXPECTED_RELEASE"
      - name: Write the check summary
        if: always()
        env:
          INSIDE: ${{ steps.inside.outcome }}
          OUTSIDE: ${{ steps.outside.outcome }}
          UNIT: ${{ steps.unit.outcome }}
          CLI: ${{ steps.cli.outcome }}
        run: |
          {
            printf '### Lantern — %s\n\n' "$GITHUB_REF_NAME"
            printf 'Commit: `%s`\n\n' "$GITHUB_SHA"
            printf '| Check | Outcome |\n| --- | --- |\n'
            printf '| %s | %s |\n' Testinfra "$INSIDE" HTTPX "$OUTSIDE" Unit "$UNIT" Curl "$CLI"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Collect logs and remove the Compose stack
        if: always()
        run: |
          mkdir -p reports
          docker compose ps --all > reports/containers.log 2>&1 || true
          docker compose logs --no-color --timestamps > reports/nginx.log 2>&1 || true
          docker compose down 2>&1 | tee reports/cleanup.log
      - name: Save Lantern evidence
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: lantern-compose-evidence
          path: reports/
          retention-days: 7
